<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX YouTube Explorer</title>
    <style>
        :root {
            --bg-color: #070707;
            --panel-bg: rgba(15, 15, 15, 0.9);
            --border-color: #ff0033;
            --text-color: #dfdfdf;
            --accent-color: #ff0033;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255, 0, 51, 0.4);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 12px;
            color: #888;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            background: var(--panel-bg);
            border: 1px solid #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.3);
        }

        button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-card {
            background: var(--panel-bg);
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }

        .video-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 0, 51, 0.2);
        }

        .video-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #000;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .channel-title {
            font-size: 11px;
            color: #888;
        }

        /* Modal المشغل */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16/9;
            position: relative;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>SLAX YOUTUBE EXPLORER</h1>
        <p class="subtitle">منصة جلب وعرض محتوى يوتيوب عبر API</p>
    </header>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="ابحث عن أي فيديو أو محتوى...">
        <button id="search-btn">بحث</button>
    </div>

    <div id="results" class="results-grid"></div>

    <!-- نافذة التشغيل المنبثقة -->
    <div id="player-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-btn">&times;</span>
            <iframe id="yt-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ضع مفتاح YouTube API الخاص بك هنا (YouTube Data API v3)
        const API_KEY = 'YOUR_YOUTUBE_API_KEY_HERE';

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultsGrid = document.getElementById('results');
        const playerModal = document.getElementById('player-modal');
        const ytIframe = document.getElementById('yt-iframe');
        const closeBtn = document.getElementById('close-btn');

        async function searchVideos(query) {
            if (!query.trim()) return;
            resultsGrid.innerHTML = '<p style="text-align:center; color:#888; grid-column: 1/-1;">جاري البحث في الأرشيف...</p>';

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=${encodeURIComponent(query)}&key=${API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.items) {
                    displayResults(data.items);
                } else {
                    resultsGrid.innerHTML = '<p style="text-align:center; color:#ff0033; grid-column: 1/-1;">خطأ في جلب البيانات، تأكد من صحة API Key.</p>';
                }
            } catch (error) {
                console.error(error);
                resultsGrid.innerHTML = '<p style="text-align:center; color:#ff0033; grid-column: 1/-1;">حدث خطأ في الاتصال بالشبكة.</p>';
            }
        }

        function displayResults(items) {
            resultsGrid.innerHTML = '';
            items.forEach(item => {
                const videoId = item.id.videoId;
                const snippet = item.snippet;

                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <img class="video-thumb" src="${snippet.thumbnails.high.url}" alt="${snippet.title}">
                    <div class="video-info">
                        <div class="video-title">${snippet.title}</div>
                        <div class="channel-title">${snippet.channelTitle}</div>
                    </div>
                `;

                card.onclick = () => {
                    ytIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    playerModal.style.display = 'flex';
                };

                resultsGrid.appendChild(card);
            });
        }

        searchBtn.onclick = () => searchVideos(searchInput.value);
        searchInput.onkeypress = (e) => { if (e.key === 'Enter') searchVideos(searchInput.value); };

        closeBtn.onclick = () => {
            playerModal.style.display = 'none';
            ytIframe.src = '';
        };

        playerModal.onclick = (e) => {
            if (e.target === playerModal) {
                playerModal.style.display = 'none';
                ytIframe.src = '';
            }
        };
    </script>
</body>
</html>
